<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StudyFlow Server</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f0f4f8; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2d3748; }
    </style>
</head>
<body>
    <div class="card">
        <h1>StudyFlow Server</h1>
        <p>Aplikasi ini mengelola database, API, dan koneksi jaringan sekolah Anda.</p>
        <div id="status">Status: Menunggu inisialisasi...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        window.api.onStatusUpdate((msg) => {
            const p = document.createElement('p');
            p.textContent = msg;
            p.style.fontSize = '12px';
            p.style.color = '#4a5568';
            p.style.margin = '4px 0';
            statusDiv.appendChild(p);

            // Limit logs to 50 to prevent DOM flooding
            while (statusDiv.childElementCount > 51) { // 50 logs + 1 title text/wait message
                statusDiv.removeChild(statusDiv.childNodes[1]); // Remove first log (after the "Status:" text)
            }

            // Auto-scroll
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
