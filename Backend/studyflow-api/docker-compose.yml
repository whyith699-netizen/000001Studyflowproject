services:
  db:
    image: mariadb:10.11
    container_name: studyflow-db
    restart: always
    environment:
      MARIADB_DATABASE: studyflow
      MARIADB_USER: studyflow
      MARIADB_PASSWORD: studyflow_local_password
      MARIADB_ROOT_PASSWORD: root_password_change_me
    volumes:
      - ./mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - studyflow-network

  api:
    build: .
    container_name: studyflow-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=studyflow
      - DB_PASSWORD=studyflow_local_password
      - DB_NAME=studyflow
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/service-account.json
    depends_on:
      - db
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    networks:
      - studyflow-network

networks:
  studyflow-network:
    driver: bridge
