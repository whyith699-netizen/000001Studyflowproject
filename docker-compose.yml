services:
  frontend:
    build: 
      context: ./Applications
      dockerfile: Dockerfile
    container_name: studyflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - studyflow-network

  api:
    build: 
      context: ./Backend/studyflow-api
      dockerfile: Dockerfile
    container_name: studyflow-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-studyflow}
      - DB_PASSWORD=${DB_PASSWORD:-studyflow_local_password}
      - DB_NAME=${DB_NAME:-studyflow}
    depends_on:
      - db
    networks:
      - studyflow-network

  db:
    image: mariadb:10.11
    container_name: studyflow-db
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_NAME:-studyflow}
      MARIADB_USER: ${DB_USER:-studyflow}
      MARIADB_PASSWORD: ${DB_PASSWORD:-studyflow_local_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - studyflow-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin01
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - studyflow-network

networks:
  studyflow-network:
    driver: bridge

volumes:
  mariadb_data:
